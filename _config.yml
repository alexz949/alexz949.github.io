# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: blank # the website title (if blank, full name will be used instead)
first_name: Lixun (Alex)
middle_name:
last_name: Zhang
contact_note: >
  Email is the best way to reach me.
description: >
  Lixun (Alex) Zhang's personal website: machine learning, numerical linear algebra, and model compression.
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
keywords: machine learning, numerical linear algebra, model compression
lang: en
icon: favicon.png # favicon: an image in /assets/img/
apple_touch_icon: apple-touch-icon.png # 180x180 image in /assets/img/ for iOS home-screen bookmarks

url: https://alexz949.github.io
baseurl: ""
last_updated: false
back_to_top: true

# GitHub stats cards on the repositories page
repo_theme_light: default
repo_theme_dark: dark
external_services:
  github_readme_stats_url: https://github-stats-extended.vercel.app

# -----------------------------------------------------------------------------
# al-folio API (v1.x)
# -----------------------------------------------------------------------------

al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  features:
    cv:
      enabled: false # the cv page shows assets/pdf/Lixun_Zhang_CV.pdf instead
    distill:
      enabled: false

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true
search_enabled: true
socials_in_search: true
posts_in_search: true
bib_search: true
max_width: 930px

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: Lixun (Alex) Zhang
blog_description: notes on algorithms, linear algebra, and machine learning
permalink: /blog/:year/:title/

pagination:
  enabled: true

related_blog_posts:
  enabled: true
  max_related: 5

jekyll-archives:
  posts:
    enabled: [year, tags, categories]
    permalinks:
      year: "/blog/:year/"
      tags: "/blog/:type/:name/"
      categories: "/blog/:type/:name/"

display_tags: [] # tags shown on the front page of the blog
display_categories: [] # categories shown on the front page of the blog

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ["_pages"]
exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules/
  - package.json
  - package-lock.json
  - purgecss.config.js
  - README.md
  - vendor
keep_files:
  - CNAME
  - .nojekyll

theme: al_folio_core

plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-feed
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-toc
  - al_folio_core
  - al_icons
  - al_img_tools
  - al_search
  - al_math
  - al_citations

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false # keep assets out of the sitemap

sass:
  style: compressed

jekyll-minifier:
  compress_javascript: false
  # Re-minifying CSS breaks Tailwind v4 calc() spacing tokens, so leave it off.
  compress_css: false
  exclude: ["robots.txt"]

# -----------------------------------------------------------------------------
# Papers (jekyll-scholar)
# -----------------------------------------------------------------------------

scholar:
  last_name: [Zhang]
  first_name: [Lixun, Alex, L., A.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false

# Bib fields used by the site, hidden from the rendered BibTeX
filtered_bibtex_keywords:
  [
    abbr,
    abstract,
    additional_info,
    altmetric,
    annotation,
    arxiv,
    award,
    award_name,
    bibtex_show,
    blog,
    code,
    dimensions,
    eprint,
    google_scholar_id,
    hal,
    html,
    inspirehep_id,
    pdf,
    pmid,
    poster,
    preview,
    selected,
    status,
    slides,
    supp,
    video,
    website,
  ]

max_author_limit: 5 # more authors are revealed on click
more_authors_animation_delay: 10
enable_publication_thumbnails: true

# -----------------------------------------------------------------------------
# Links and images
# -----------------------------------------------------------------------------

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

imagemagick:
  enabled: false # responsive WebP copies; needs ImageMagick at build time
lazy_loading_images: true

# -----------------------------------------------------------------------------
# Optional features
# -----------------------------------------------------------------------------

enable_masonry: true
enable_math: true
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: false
enable_medium_zoom: true
enable_progressbar: true

