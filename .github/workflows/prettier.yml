name: Prettier code formatter

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install Prettier 💾
        run: npm ci
      - name: Prettier Check 🔎
        run: npx prettier . --check
