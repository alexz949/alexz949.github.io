name: Deploy site

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/prettier.yml"
      - "README.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build 🔧
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Purge unused CSS 🧹
        run: npx --yes purgecss -c purgecss.config.js
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
